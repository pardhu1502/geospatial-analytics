services:
  db:
    image: postgis/postgis:15-3.4
    container_name: darukaa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: darukaa
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa
    ports:
      - "5432:5432"
    volumes:
      - darukaa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darukaa -d darukaa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  darukaa_pgdata:
