# Render Blueprint for Darukaa.Earth
# https://render.com/docs/blueprint-spec
#
# NOTE: Render's managed Postgres does NOT have PostGIS enabled by default, and
# Blueprints cannot run arbitrary SQL against the created database. The Alembic
# migration in backend/alembic already includes `CREATE EXTENSION IF NOT EXISTS
# postgis`, and the backend's startCommand runs `alembic upgrade head` on every
# start, so PostGIS and the schema are set up automatically on first deploy.
#
# NOTE: Render appends a random suffix to a service's URL when its name is taken
# (e.g. darukaa-backend-1atn.onrender.com). The URLs in VITE_API_BASE_URL and
# CORS_ORIGINS below must match the real URLs shown in the Render dashboard.

databases:
  - name: darukaa-db
    databaseName: darukaa
    user: darukaa
    plan: free

services:
  - type: web
    name: darukaa-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    # Migrations run on every start (idempotent) so the free plan, which has no
    # Render Shell, still gets the schema and the PostGIS extension.
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://darukaa-frontend.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: darukaa-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://darukaa-backend-1atn.onrender.com
      - key: VITE_MAPBOX_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
